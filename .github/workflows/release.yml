name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APKs
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/apk"
          ./gradlew assembleRelease -PapiBaseUrl=http://10.0.2.2:3000/
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/field-monitoring-$version-emulator.apk"
          ./gradlew assembleRelease -PapiBaseUrl=http://localhost:3000/
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/field-monitoring-$version-usb.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Android APKs for Field Monitoring & Evaluation $version. Both files are the same app and differ only in the backend address.

          | File | Backend address | Use with |
          |------|-----------------|----------|
          | \`field-monitoring-$version-emulator.apk\` | \`http://10.0.2.2:3000\` | The Android Emulator on the machine that runs the backend |
          | \`field-monitoring-$version-usb.apk\` | \`http://localhost:3000\` | A physical device on USB, after \`adb reverse tcp:3000 tcp:3000\` |

          Start the backend with \`docker compose up -d --build\`, then sign in with a demo account from the README.
          EOF
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/apk/*.apk --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
